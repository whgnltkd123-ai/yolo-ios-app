workflows:
  ios-build-check:
    name: YOLO iOS Build Check (unsigned)
    instance_type: mac_mini_m2
    max_build_duration: 120
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true
    environment:
      xcode: latest
    scripts:
      - name: Build the original YOLO iOS app (unsigned)
        script: |
          set -euo pipefail
          xcodebuild \
            -project "YOLOiOSApp/YOLOiOSApp.xcodeproj" \
            -scheme "YOLOiOSApp" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$CM_BUILD_DIR/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Create an unsigned IPA for Windows Sideloadly signing
        script: |
          set -euo pipefail
          APP="$CM_BUILD_DIR/build/DerivedData/Build/Products/Release-iphoneos/YOLOiOSApp.app"
          test -d "$APP"
          mkdir -p "$CM_BUILD_DIR/build/unsigned-package/Payload"
          cp -R "$APP" "$CM_BUILD_DIR/build/unsigned-package/Payload/"
          cd "$CM_BUILD_DIR/build/unsigned-package"
          /usr/bin/zip -qry "$CM_BUILD_DIR/build/YOLOiOSApp-unsigned.ipa" Payload
    artifacts:
      - build/YOLOiOSApp-unsigned.ipa
      - build/DerivedData/Build/Products/Release-iphoneos/*.app
      - /tmp/xcodebuild_logs/*.log

  bird-drone-prototype:
    name: Bird vs Drone - Core ML Test (unsigned)
    # Manual only: the pretrained checkpoint is third-party and the build uses
    # additional macOS compute time. Do not attach production signing secrets.
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      xcode: latest
    scripts:
      - name: Download, verify and convert candidate 2-class bird/drone YOLO
        script: |
          set -euo pipefail
          PYTHON="$(command -v python3.11 || command -v python3)"
          "$PYTHON" -m venv "$CM_BUILD_DIR/.bird-drone-venv"
          source "$CM_BUILD_DIR/.bird-drone-venv/bin/activate"
          python -m pip install --upgrade pip
          python -m pip install "ultralytics>=8.3,<9" "coremltools>=8,<10" "numpy<2.4" "certifi>=2025.4"
          python tools/prepare_pretrained_bird_drone.py
          test -d "YOLOiOSApp/Models/Detect/yolo8s-birddrone.mlpackage"
      - name: Build original YOLO iOS engine with bird/drone test model
        script: |
          set -euo pipefail
          xcodebuild \
            -project "YOLOiOSApp/YOLOiOSApp.xcodeproj" \
            -scheme "YOLOiOSApp" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$CM_BUILD_DIR/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Produce unsigned bird/drone prototype IPA
        script: |
          set -euo pipefail
          APP="$CM_BUILD_DIR/build/DerivedData/Build/Products/Release-iphoneos/YOLOiOSApp.app"
          test -d "$APP"
          mkdir -p "$CM_BUILD_DIR/build/bird-drone-package/Payload"
          cp -R "$APP" "$CM_BUILD_DIR/build/bird-drone-package/Payload/"
          cd "$CM_BUILD_DIR/build/bird-drone-package"
          /usr/bin/zip -qry "$CM_BUILD_DIR/build/YOLO-Bird-Drone-unsigned.ipa" Payload
    artifacts:
      - build/YOLO-Bird-Drone-unsigned.ipa
      - build/DerivedData/Build/Products/Release-iphoneos/*.app
      - /tmp/xcodebuild_logs/*.log
