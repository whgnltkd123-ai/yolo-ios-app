workflows:
  ios-build-check:
    name: YOLO iOS Build Check (unsigned)
    instance_type: mac_mini_m2
    max_build_duration: 120
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true
    environment:
      xcode: latest
    scripts:
      - name: Build the original YOLO iOS app (unsigned)
        script: |
          set -euo pipefail
          xcodebuild \
            -project "YOLOiOSApp/YOLOiOSApp.xcodeproj" \
            -scheme "YOLOiOSApp" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$CM_BUILD_DIR/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Create an unsigned IPA for Windows Sideloadly signing
        script: |
          set -euo pipefail
          APP="$CM_BUILD_DIR/build/DerivedData/Build/Products/Release-iphoneos/YOLOiOSApp.app"
          test -d "$APP"
          mkdir -p "$CM_BUILD_DIR/build/unsigned-package/Payload"
          cp -R "$APP" "$CM_BUILD_DIR/build/unsigned-package/Payload/"
          cd "$CM_BUILD_DIR/build/unsigned-package"
          /usr/bin/zip -qry "$CM_BUILD_DIR/build/YOLOiOSApp-unsigned.ipa" Payload
    artifacts:
      - build/YOLOiOSApp-unsigned.ipa
      - build/DerivedData/Build/Products/Release-iphoneos/*.app
      - /tmp/xcodebuild_logs/*.log
