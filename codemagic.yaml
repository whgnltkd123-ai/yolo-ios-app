workflows:
  ios-build-check:
    name: YOLO iOS Build Check (unsigned)
    instance_type: mac_mini_m2
    max_build_duration: 120
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true
    environment:
      xcode: latest
    scripts:
      - name: Build the original YOLO iOS app (unsigned)
        script: |
          set -euo pipefail
          xcodebuild \
            -project "YOLOiOSApp/YOLOiOSApp.xcodeproj" \
            -scheme "YOLOiOSApp" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$CM_BUILD_DIR/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Create an unsigned IPA for Windows Sideloadly signing
        script: |
          set -euo pipefail
          APP="$CM_BUILD_DIR/build/DerivedData/Build/Products/Release-iphoneos/YOLOiOSApp.app"
          test -d "$APP"
          mkdir -p "$CM_BUILD_DIR/build/unsigned-package/Payload"
          cp -R "$APP" "$CM_BUILD_DIR/build/unsigned-package/Payload/"
          cd "$CM_BUILD_DIR/build/unsigned-package"
          /usr/bin/zip -qry "$CM_BUILD_DIR/build/YOLOiOSApp-unsigned.ipa" Payload
    artifacts:
      - build/YOLOiOSApp-unsigned.ipa
      - build/DerivedData/Build/Products/Release-iphoneos/*.app
      - /tmp/xcodebuild_logs/*.log

  bird-drone-prototype:
    name: Bird vs Drone - Core ML Test (unsigned)
    # Manual only: the pretrained checkpoint is third-party and the build uses
    # additional macOS compute time. Do not attach production signing secrets.
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      xcode: latest
    scripts:
      - name: Download, verify and convert candidate 2-class bird/drone YOLO
        script: |
          set -euo pipefail
          PYTHON="$(command -v python3.11 || command -v python3)"
          "$PYTHON" -m venv "$CM_BUILD_DIR/.bird-drone-venv"
          source "$CM_BUILD_DIR/.bird-drone-venv/bin/activate"
          python -m pip install --upgrade pip
          python -m pip install "ultralytics>=8.3,<9" "coremltools>=8,<10" "numpy<2.4" "certifi>=2025.4"
          python tools/prepare_pretrained_bird_drone.py
          test -d "YOLOiOSApp/Models/Detect/yolo8s-birddrone.mlpackage"
      - name: Build original YOLO iOS engine with bird/drone test model
        script: |
          set -euo pipefail
          xcodebuild \
            -project "YOLOiOSApp/YOLOiOSApp.xcodeproj" \
            -scheme "YOLOiOSApp" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$CM_BUILD_DIR/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Produce unsigned bird/drone prototype IPA
        script: |
          set -euo pipefail
          APP="$CM_BUILD_DIR/build/DerivedData/Build/Products/Release-iphoneos/YOLOiOSApp.app"
          test -d "$APP"
          mkdir -p "$CM_BUILD_DIR/build/bird-drone-package/Payload"
          cp -R "$APP" "$CM_BUILD_DIR/build/bird-drone-package/Payload/"
          cd "$CM_BUILD_DIR/build/bird-drone-package"
          /usr/bin/zip -qry "$CM_BUILD_DIR/build/YOLO-Bird-Drone-unsigned.ipa" Payload
    artifacts:
      - build/YOLO-Bird-Drone-unsigned.ipa
      - build/DerivedData/Build/Products/Release-iphoneos/*.app
      - /tmp/xcodebuild_logs/*.log

  yolo26-drone-alert:
    name: YOLO26 Drone Alert - 3 Levels (trained model required, unsigned)
    # Uses native YOLO26 detector architecture, not the previous YOLOv8s checkpoint.
    # A user-trained bird/drone YOLO26n checkpoint is MANDATORY; never fake training.
    # No signing secrets: download only a trusted checkpoint.
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      xcode: latest
    scripts:
      - name: Verify trained YOLO26 checkpoint and convert to Core ML
        script: |
          set -euo pipefail
          : "${YOLO26_DRONE_CHECKPOINT_URL:?Set the HTTPS URL of your own trained YOLO26 bird/drone best.pt}"
          : "${YOLO26_DRONE_CHECKPOINT_SHA256:?Set SHA256 for that exact best.pt}"
          PYTHON="$(command -v python3.11 || command -v python3)"
          "$PYTHON" -m venv "$CM_BUILD_DIR/.yolo26-drone-venv"
          source "$CM_BUILD_DIR/.yolo26-drone-venv/bin/activate"
          python -m pip install --upgrade pip
          python -m pip install "ultralytics>=8.4,<9" "coremltools>=9,<11" "numpy<2.4" "certifi>=2025.4"
          python tools/import_trained_yolo26_drone.py
          test -f "YOLOiOSApp/Models/Detect/yolo26n-birddrone.mlpackage/Manifest.json"
      - name: Build native YOLO26 iOS app with fine-tuned bird/drone weights
        script: |
          set -euo pipefail
          xcodebuild \
            -project "YOLOiOSApp/YOLOiOSApp.xcodeproj" \
            -scheme "YOLOiOSApp" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$CM_BUILD_DIR/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Produce unsigned YOLO26 drone alert IPA for Windows Sideloadly
        script: |
          set -euo pipefail
          APP="$CM_BUILD_DIR/build/DerivedData/Build/Products/Release-iphoneos/YOLOiOSApp.app"
          test -d "$APP"
          mkdir -p "$CM_BUILD_DIR/build/yolo26-drone-package/Payload"
          cp -R "$APP" "$CM_BUILD_DIR/build/yolo26-drone-package/Payload/"
          cd "$CM_BUILD_DIR/build/yolo26-drone-package"
          /usr/bin/zip -qry "$CM_BUILD_DIR/build/YOLO26-Drone-Alert-unsigned.ipa" Payload
    artifacts:
      - build/YOLO26-Drone-Alert-unsigned.ipa
      - build/DerivedData/Build/Products/Release-iphoneos/*.app
      - /tmp/xcodebuild_logs/*.log

  yolo26-81-class:
    name: YOLO26 81 Classes - COCO80 + Drone (trained model required, unsigned)
    # This Mac builder DOES NOT train; it verifies trained GPU weights and exports iOS.
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      xcode: latest
    scripts:
      - name: Verify trained 81-class model and export optimized Core ML
        script: |
          set -euo pipefail
          : "\${YOLO26_81_CHECKPOINT_URL:?Set trained YOLO26n COCO80+drone HTTPS best.pt URL}"
          : "\${YOLO26_81_CHECKPOINT_SHA256:?Set exact SHA256 of trained best.pt}"
          PYTHON="$(command -v python3.11 || command -v python3)"
          "$PYTHON" -m venv "$CM_BUILD_DIR/.yolo26-81-venv"
          source "$CM_BUILD_DIR/.yolo26-81-venv/bin/activate"
          python -m pip install --upgrade pip
          python -m pip install "ultralytics>=8.4.142,<9" "coremltools>=9,<11" "numpy<2.4" "certifi>=2025.4" "pyyaml>=6"
          python tools/import_trained_yolo26_81.py
          test -f "YOLOiOSApp/Models/Detect/yolo26n-drone81.mlpackage/Manifest.json"
      - name: Build native YOLO26 camera with true 81-class drone model
        script: |
          set -euo pipefail
          xcodebuild \
            -project "YOLOiOSApp/YOLOiOSApp.xcodeproj" \
            -scheme "YOLOiOSApp" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$CM_BUILD_DIR/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Create unsigned COCO80 plus drone IPA
        script: |
          set -euo pipefail
          APP="$CM_BUILD_DIR/build/DerivedData/Build/Products/Release-iphoneos/YOLOiOSApp.app"
          test -d "$APP"
          mkdir -p "$CM_BUILD_DIR/build/81-package/Payload"
          cp -R "$APP" "$CM_BUILD_DIR/build/81-package/Payload/"
          cd "$CM_BUILD_DIR/build/81-package"
          /usr/bin/zip -qry "$CM_BUILD_DIR/build/YOLO26-Drone-81-unsigned.ipa" Payload
    artifacts:
      - build/YOLO26-Drone-81-unsigned.ipa
      - build/DerivedData/Build/Products/Release-iphoneos/*.app
      - /tmp/xcodebuild_logs/*.log
